    function normalizeTextAnswer(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/&/g, 'si')
        .replace(/[^a-z0-9]/g, '');
    }

    function stripLeadingAnswerWords(value) {
      return String(value || '').trim()
        .replace(/^(?:în|in)\s+stil(?:ul)?\s+/i, '')
        .replace(/^(?:în|in)\s+arhitectura\s+/i, '')
        .replace(/^(?:mai\s+ales\s+)?(?:în|in|la|din|prin|pentru|cu)\s+/i, '')
        .replace(/^de\s+la\s+/i, '')
        .replace(/^din\s+cauza\s+/i, '')
        .trim();
    }

    function getTextAnswerCandidates(question) {
      var source = [];
      if (Array.isArray(question.acceptedAnswers)) source = source.concat(question.acceptedAnswers);
      if (question.answer !== undefined) source.push(question.answer);
      var candidates = [];
      source.forEach(function (value) {
        var text = String(value || '').trim();
        if (!text) return;
        candidates.push(text);
        candidates.push(text.replace(/[\s\.;:,]+$/g, '').trim());
        candidates.push(stripLeadingAnswerWords(text));
        candidates.push(stripLeadingAnswerWords(text).replace(/[\s\.;:,]+$/g, '').trim());
      });
      return candidates.filter(function (value, index, arr) {
        return value && arr.indexOf(value) === index;
      });
    }

    function isTextAnswerCorrect(question, userAnswer) {
      var normalizedUser = normalizeTextAnswer(userAnswer);
      if (!normalizedUser) return false;
      return getTextAnswerCandidates(question).some(function (candidate) {
        return normalizeTextAnswer(candidate) === normalizedUser;
      });
    }


    function renderMathIn(element) {
      if (!element || !window.MathJax || !window.MathJax.typesetPromise) return;
      try {
        if (window.MathJax.typesetClear) window.MathJax.typesetClear([element]);
        window.MathJax.typesetPromise([element]).catch(function () { /* ignore MathJax errors */ });
      } catch (e) { /* ignore MathJax errors */ }
    }

    function getDisplayAnswer(question) {
      if (!question) return '';
      if (question.displayAnswer !== undefined) return String(question.displayAnswer);
      if (Array.isArray(question.answer) && Array.isArray(question.options)) {
        return question.answer.map(function (idx) { return question.options[idx]; }).filter(Boolean).join('; ');
      }
      return question.answer !== undefined ? String(question.answer) : '';
    }


    function showQuestionExplanation(question, optionsContainer) {
      if (!question || question.explanation === undefined || !optionsContainer) return;
      var explanation = String(question.explanation || '').trim();
      if (!explanation) return;
      var box = optionsContainer.querySelector('.question-explanation');
      if (!box) {
        box = document.createElement('div');
        box.className = 'question-explanation';
        optionsContainer.appendChild(box);
      }
      box.innerHTML = '';

      var answerLine = document.createElement('div');
      var answerStrong = document.createElement('strong');
      answerStrong.textContent = 'Răspuns corect: ';
      var answerText = document.createElement('span');
      answerText.textContent = getDisplayAnswer(question);
      answerLine.appendChild(answerStrong);

      box.appendChild(answerLine);

      var explanationLine = document.createElement('div');

      explanationStrong.textContent = 'Explicație: ';
      var explanationText = document.createElement('span');
      explanationText.textContent = explanation;
      explanationLine.appendChild(explanationStrong);
      explanationLine.appendChild(explanationText);
      box.appendChild(explanationLine);

      renderMathIn(box);
    }

    function isTextQuestion(question) {
      return !!question && (question.type === 'text' || question.type === 'self-grade-text');
    }


    function getCorrectIndices(question) {
      if (!question) return [];
      if (Array.isArray(question.answer)) {
        return question.answer
          .map(function (idx) { return parseInt(idx, 10); })
          .filter(function (idx) { return !Number.isNaN(idx); });
      }
      if (question.answer !== undefined && question.options) {
        var singleIdx = parseInt(question.answer, 10);
        return Number.isNaN(singleIdx) ? [] : [singleIdx];
      }
      return [];
    }

    function renderQuestionTypeBanner(question, questionEl) {
      clearQuestionTypeBanner();
      if (!questionEl || !questionEl.parentNode || !question) return;

    function renderInitialAnswerStatus(question, optionsContainer) {
      if (!question || isTextQuestion(question)) return;
      var correctCount = getCorrectIndices(question).length;
      if (correctCount > 1) {
        setAnswerStatus(
          optionsContainer,
          'multiple',
          '<strong>Multiple-answer question.</strong> There are <strong>' + correctCount + '</strong> correct choices. Select all of them; the question is only complete when all correct choices are selected.'
        );
      } else {
        setAnswerStatus(
          optionsContainer,
          'single',
          '<strong>Single-answer question.</strong> There is exactly <strong>1</strong> correct choice.'
        );
      }
    }

    function updateMultipleChoiceStatus(question, optionsContainer, state) {
      if (!question || !optionsContainer || isTextQuestion(question)) return;
      var correctCount = getCorrectIndices(question).length;
      var selectedCorrect = getSelectedCorrectCount(optionsContainer);
      if (state === 'partial') {
        setAnswerStatus(
          optionsContainer,
          'partial',
          '<strong>Correct choice selected.</strong> You have found <strong>' + selectedCorrect + ' / ' + correctCount + '</strong> correct answers. Keep selecting until you reach ' + correctCount + ' / ' + correctCount + '.'
        );
      } else if (state === 'correct') {
        var label = correctCount > 1 ? 'All correct answers selected.' : 'Correct answer selected.';
        setAnswerStatus(
          optionsContainer,
          'correct',
          '<strong>Correct.</strong> ' + label + ' Score added.'
        );
      } else if (state === 'wrong') {
        setAnswerStatus(
          optionsContainer,
          'wrong',
          '<strong>Wrong.</strong> The correct answer' + (correctCount > 1 ? 's are' : ' is') + ' now highlighted in green.'
        );
      } else if (state === 'revealed') {
        setAnswerStatus(
          optionsContainer,
          'revealed',
          '<strong>Answer shown.</strong> The correct answer' + (correctCount > 1 ? 's are' : ' is') + ' highlighted in green. This question was counted wrong if you had not completed it.'
        );
      }
    }

    function makeSelfGradeTextQuestion(question) {
      var answerTexts = [];
      if (Array.isArray(question.answer) && Array.isArray(question.options)) {
        question.answer.forEach(function (idx) {
          if (question.options[idx]) answerTexts.push(question.options[idx]);
        });
      } else if (question.answer !== undefined) {
        answerTexts.push(String(question.answer));
      }
      var out = {
        type: 'self-grade-text',
        selfGrade: true,
        question: question.question,
        answer: answerTexts.join('; '),
        displayAnswer: answerTexts.join('; '),
        acceptedAnswers: answerTexts.slice()
      };
      if (question.number !== undefined) out.number = question.number;
      if (question.category !== undefined) out.category = question.category;
      return out;
    }

    function makeSelfGradeTextQuestions(list) {
      return (list || []).map(function (question) {
        return isTextQuestion(question) ? Object.assign({}, question) : makeSelfGradeTextQuestion(question);
      });
    }

    function updateProgressTracker() {
      var total = activeQuestions.length;
      var current = Math.min(currentQuestionIndex + 1, total) || 1;
      var curEl = document.getElementById('progress-current-total');
      var corEl = document.getElementById('progress-correct');
      var wrongEl = document.getElementById('progress-wrong');
      var barEl = document.getElementById('progress-bar');
      var pctEl = document.getElementById('progress-pct');
      if (curEl) curEl.textContent = current + ' / ' + total;
      if (corEl) corEl.textContent = 'Correct: ' + score;
      if (wrongEl) wrongEl.textContent = 'Wrong: ' + wrongCount;
      if (barEl) {
        barEl.innerHTML = '';
        for (var i = 0; i < total; i++) {
          var seg = document.createElement('div');
          seg.className = 'progress-segment';
          if (answerResults[i] === true) seg.classList.add('correct');
          else if (answerResults[i] === false) seg.classList.add('wrong');
          else seg.classList.add('pending');
          barEl.appendChild(seg);
        }
      }
      var answered = score + wrongCount;
      var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
      if (pctEl) pctEl.textContent = pct + '%';
    }

      const percentage = total > 0 ? Math.round((score / total) * 100) : 0;

      const progressPct = total > 0 ? Math.round((answered / total) * 100) : 0;
      var currentList = questions[currentCategory] || (currentCategory === ARCHITECTURAL_CATEGORY_ID ? ARCHITECTURAL_ELEMENTS_QUESTIONS : []);
      const lifetime = currentCategory !== null ? getCategorySummary(currentCategory, currentList) : getLifetimeSummary();

      var completeLabel = currentQuizMode === 'wrong-practice' ? 'Wrong-question practice complete!' : 'Quiz complete!';
      if (currentQuizFormat === 'text-box') completeLabel += ' (Text Box)';
      questionEl.textContent = completeLabel;
      clearQuestionTypeBanner();
      optionsContainer.innerHTML = '<div class="results-panel">' +
        '<h2>Your results</h2>' +
        '<p class="results-score">' + score + ' / ' + total + '</p>' +
        '<p class="results-percentage">' + percentage + '% correct</p>' +
        '<p class="results-summary">Correct: ' + score + ' &middot; Wrong: ' + wrongCount + ' &middot; Progress: ' + progressPct + '%</p>' +
        '<p class="results-summary" style="margin-top:0.75rem;color:#445;">Lifetime for this category: ' + lifetime.attemptedQuestions + '/' + lifetime.totalQuestions + ' questions tried &middot; ' + lifetime.accuracy + '% accuracy</p>' +
        '</div>';
      appendResultsWrongPracticeActions(optionsContainer);
      updateProgressTracker();
      clearSavedSession();

      const timerEl = document.querySelector('.timer');
      if (timerEl) timerEl.textContent = formatTime(0);
      var showBtn = document.getElementById('btn-show-answer');
      if (showBtn) showBtn.disabled = true;
      var backBtn = document.getElementById('btn-back');
      if (backBtn) backBtn.classList.remove('hidden');
      var nextBtn = document.getElementById('btn-next-question');
      if (nextBtn) nextBtn.classList.add('hidden');
    }

    function startWaitCountdown(startRemaining) {
      stopWaitTimer();
      if (noTimersMode) {
        goToNextQuestion();
        return;
      }
      waitRemainingSec = startRemaining !== undefined ? startRemaining : waitBetweenSec;
      if (waitRemainingSec <= 0) {
        goToNextQuestion();
        return;
      }
      const timerEl = document.querySelector('.timer');
      if (timerEl) timerEl.textContent = formatTime(waitRemainingSec) + ' until next';

      waitTimerId = setInterval(() => {
        if (isPaused) return;
        waitRemainingSec -= 1;
        if (timerEl) timerEl.textContent = formatTime(waitRemainingSec) + ' until next';
        if (waitRemainingSec <= 0) {
          stopWaitTimer();
          goToNextQuestion();
        }
      }, 1000);
    }

    function handleTimeUp(question, optionsContainer) {
      stopQuestionTimer();
      clearPauseState();
      if (answerResults[currentQuestionIndex] === undefined && !(question && question.selfGrade)) {
        answerResults[currentQuestionIndex] = false;
        wrongCount += 1;
        recordQuestionResult(question, false);
        updateProgressTracker();
        saveSession();
      }
      const timerEl = document.querySelector('.timer');
      if (timerEl) timerEl.textContent = formatTime(0);

      if (isTextQuestion(question)) {
        revealTextAnswer(question, optionsContainer, false);
        if (!question.selfGrade && !noTimersMode) startWaitCountdown();
        return;
      }

      const buttons = optionsContainer.querySelectorAll('.option-btn');
      buttons.forEach((btn) => { btn.disabled = true; });
      getCorrectIndices(question).forEach((idx) => {
        if (buttons[idx]) buttons[idx].classList.add('correct');
      });
      updateMultipleChoiceStatus(question, optionsContainer, 'revealed');
      var showBtn = document.getElementById('btn-show-answer');
      if (showBtn) showBtn.disabled = true;
      showQuestionExplanation(question, optionsContainer);
      if (!noTimersMode) startWaitCountdown();
    }

    function clearPauseState() {
      isPaused = false;
      pausePhase = null;
      pauseRemaining = 0;
      pauseQuestion = null;
      pauseOptionsContainer = null;
      setPauseResumeVisibility(false);
    }

    function startQuestionTimer(question, optionsContainer, startRemaining) {
      stopQuestionTimer();
      clearPauseState();
      if (noTimersMode) return;
      questionRemainingSec = startRemaining !== undefined ? startRemaining : questionTimeSec;
      const timerEl = document.querySelector('.timer');
      if (timerEl) timerEl.textContent = formatTime(questionRemainingSec);

      questionTimerId = setInterval(() => {
        if (isPaused) return;
        questionRemainingSec -= 1;
        if (timerEl) timerEl.textContent = formatTime(questionRemainingSec);
        if (questionRemainingSec <= 0) {
          handleTimeUp(question, optionsContainer);
        }
      }, 1000);
    }

    function revealTextAnswer(question, optionsContainer, wasCorrect) {
      var input = optionsContainer.querySelector('.text-answer-input');
      var submitBtn = optionsContainer.querySelector('.text-answer-submit');
      var feedback = optionsContainer.querySelector('.text-answer-feedback');
      var review = optionsContainer.querySelector('.text-answer-review');
      var gradeActions = optionsContainer.querySelector('.self-grade-actions');
      var isSelfGrade = !!(question && question.selfGrade);
      var typedAnswer = input ? input.value.trim() : '';

      if (input) {
        input.disabled = true;
        input.classList.remove('correct', 'wrong');
        if (!isSelfGrade) input.classList.add(wasCorrect ? 'correct' : 'wrong');
      }
      if (submitBtn) submitBtn.disabled = true;

      if (review) {
        review.classList.add('visible');
        review.innerHTML = '<strong>Your answer</strong>' + (typedAnswer ? escapeHtml(typedAnswer) : '<em>No answer typed.</em>');
        renderMathIn(review);
      }

      if (feedback) {
        feedback.classList.remove('correct', 'wrong', 'shown');
        if (isSelfGrade) {
          feedback.classList.add('shown');
          feedback.textContent = 'Correct answer: ' + getDisplayAnswer(question);
        } else {
          feedback.classList.add(wasCorrect ? 'correct' : 'wrong');
          feedback.textContent = wasCorrect ? 'Correct!' : 'Correct answer: ' + getDisplayAnswer(question);
        }
        renderMathIn(feedback);
      }

      if (gradeActions && isSelfGrade && answerResults[currentQuestionIndex] === undefined) {
        gradeActions.classList.add('visible');
      }

      var showBtn = document.getElementById('btn-show-answer');
      if (showBtn) showBtn.disabled = true;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function markSelfGradedAnswer(question, optionsContainer, wasCorrect) {
      if (answerResults[currentQuestionIndex] !== undefined) return;
      answerResults[currentQuestionIndex] = wasCorrect;
      if (wasCorrect) score += 1;
      else wrongCount += 1;
      recordQuestionResult(question, wasCorrect);
      updateProgressTracker();
      saveSession();

      var input = optionsContainer.querySelector('.text-answer-input');
      if (input) {
        input.classList.remove('correct', 'wrong');
        input.classList.add(wasCorrect ? 'correct' : 'wrong');
      }

      var gradeButtons = optionsContainer.querySelectorAll('.self-grade-actions .btn');
      gradeButtons.forEach(function (btn) { btn.disabled = true; });

      var feedback = optionsContainer.querySelector('.text-answer-feedback');
      if (feedback) {
        feedback.classList.remove('shown', 'correct', 'wrong');
        feedback.classList.add(wasCorrect ? 'correct' : 'wrong');
        feedback.textContent = (wasCorrect ? 'Marked right. ' : 'Marked for review. ') + 'Correct answer: ' + getDisplayAnswer(question);
        renderMathIn(feedback);
      }

      if (!noTimersMode) startWaitCountdown();
    }

    function handleTextAnswerSubmit(question, optionsContainer) {
      if (answerResults[currentQuestionIndex] !== undefined) return;
      var input = optionsContainer.querySelector('.text-answer-input');
      if (!input) return;
      stopQuestionTimer();
      clearPauseState();

      if (question.selfGrade) {
        revealTextAnswer(question, optionsContainer, null);
        saveSession();
        return;
      }

      var wasCorrect = isTextAnswerCorrect(question, input.value);
      answerResults[currentQuestionIndex] = wasCorrect;
      if (wasCorrect) score += 1;
      else wrongCount += 1;
      recordQuestionResult(question, wasCorrect);
      updateProgressTracker();
      saveSession();
      revealTextAnswer(question, optionsContainer, wasCorrect);
      if (!noTimersMode) startWaitCountdown();
    }

    function renderTextAnswerQuestion(question, optionsContainer) {
      var form = document.createElement('form');
      form.className = 'text-answer-form';
      form.autocomplete = 'off';

      var modeNote = document.createElement('div');
      modeNote.className = 'answer-status revealed';
      modeNote.innerHTML = question.selfGrade
        ? '<strong>Text / self-grade question.</strong> Type what you remember, reveal the official answer, then mark yourself Right, Wrong, or Don\'t know.'
        : '<strong>Text-answer question.</strong> Type one answer and submit it.';
      form.appendChild(modeNote);

      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'text-answer-input';
      input.placeholder = 'Type your answer...';
      input.setAttribute('aria-label', 'Type your answer');
      form.appendChild(input);

      var hint = document.createElement('p');
      hint.className = 'text-answer-hint';
      hint.textContent = question.selfGrade
        ? 'Write what you remember. After you reveal the answer, grade yourself: Right, Wrong, or Don\'t know.'
        : 'Capitalization, spaces, punctuation, special characters, and Romanian accents are ignored.';
      form.appendChild(hint);

      var submitBtn = document.createElement('button');
      submitBtn.type = 'submit';
      submitBtn.className = 'btn btn-pause text-answer-submit';
      submitBtn.textContent = question.selfGrade ? 'Show correct answer' : 'Submit answer';
      form.appendChild(submitBtn);

      var review = document.createElement('p');
      review.className = 'text-answer-review';
      form.appendChild(review);

      var feedback = document.createElement('p');
      feedback.className = 'text-answer-feedback';
      feedback.setAttribute('aria-live', 'polite');
      form.appendChild(feedback);

      if (question.selfGrade) {
        var gradeActions = document.createElement('div');
        gradeActions.className = 'self-grade-actions';

        var rightBtn = document.createElement('button');
        rightBtn.type = 'button';
        rightBtn.className = 'btn btn-grade-right';
        rightBtn.textContent = 'Right';
        rightBtn.addEventListener('click', function () {
          markSelfGradedAnswer(question, optionsContainer, true);
        });
        gradeActions.appendChild(rightBtn);

        var wrongBtn = document.createElement('button');
        wrongBtn.type = 'button';
        wrongBtn.className = 'btn btn-grade-wrong';
        wrongBtn.textContent = 'Wrong';
        wrongBtn.addEventListener('click', function () {
          markSelfGradedAnswer(question, optionsContainer, false);
        });
        gradeActions.appendChild(wrongBtn);

        var dontKnowBtn = document.createElement('button');
        dontKnowBtn.type = 'button';
        dontKnowBtn.className = 'btn btn-grade-unknown';
        dontKnowBtn.textContent = 'Don\'t know';
        dontKnowBtn.addEventListener('click', function () {
          markSelfGradedAnswer(question, optionsContainer, false);
        });
        gradeActions.appendChild(dontKnowBtn);

        form.appendChild(gradeActions);
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        handleTextAnswerSubmit(question, optionsContainer);
      });

      optionsContainer.appendChild(form);
      setTimeout(function () { input.focus(); }, 0);
    }

    function displayQuestion(index) {
      const questionEl = document.querySelector('.question-text');
      const optionsContainer = document.getElementById('options-container');
      stopQuestionTimer();
      stopWaitTimer();
      clearPauseState();

      if (index < 0 || index >= activeQuestions.length) {
        showResults();
        return;
      }

      const question = activeQuestions[index];
      questionEl.textContent = (currentQuizMode === 'wrong-practice' ? 'Practice: ' : '') + (question.number !== undefined ? question.number + ') ' : '') + question.question;
      renderQuestionTypeBanner(question, questionEl);

      optionsContainer.innerHTML = '';
      if (isTextQuestion(question)) {
        renderTextAnswerQuestion(question, optionsContainer);
      } else {
        renderInitialAnswerStatus(question, optionsContainer);
        const correctCount = getCorrectIndices(question).length;
        question.options.forEach((optionText, i) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn option-btn';
          if (correctCount > 1) btn.classList.add('multi-answer-option');
          btn.dataset.index = String(i);
          btn.textContent = optionText;
          btn.addEventListener('click', () => handleOptionClick(btn, question, optionsContainer));
          optionsContainer.appendChild(btn);
        });
      }

      renderMathIn(questionEl);
      renderMathIn(optionsContainer);

      var showBtn = document.getElementById('btn-show-answer');
      if (showBtn) showBtn.disabled = false;
      var nextBtn = document.getElementById('btn-next-question');
      var timerEl = document.querySelector('.timer');
      if (noTimersMode) {
        if (nextBtn) nextBtn.classList.remove('hidden');
        if (timerEl) timerEl.textContent = 'No limit';
      } else {
        if (nextBtn) nextBtn.classList.add('hidden');
        startQuestionTimer(question, optionsContainer);
      }
      updateProgressTracker();
      saveSession();
    }

    function handleOptionClick(clickedBtn, question, optionsContainer) {
      const buttons = optionsContainer.querySelectorAll('.option-btn');
      if (buttons[0].disabled) return;
      if (clickedBtn.classList.contains('correct') || clickedBtn.classList.contains('wrong')) return;

      const clickedIndex = parseInt(clickedBtn.dataset.index, 10);
      const correctIndices = getCorrectIndices(question);
      const isCorrect = correctIndices.includes(clickedIndex);

      clickedBtn.classList.add(isCorrect ? 'correct' : 'wrong');

      if (isCorrect) {
        const correctSelectedCount = optionsContainer.querySelectorAll('.option-btn.correct').length;
        if (correctSelectedCount === correctIndices.length) {
          score += 1;
          answerResults[currentQuestionIndex] = true;
          recordQuestionResult(question, true);
          updateProgressTracker();
          saveSession();
          stopQuestionTimer();
          buttons.forEach((btn) => { btn.disabled = true; });
          updateMultipleChoiceStatus(question, optionsContainer, 'correct');
          showQuestionExplanation(question, optionsContainer);
          if (!noTimersMode) startWaitCountdown();
        } else {
          updateMultipleChoiceStatus(question, optionsContainer, 'partial');
        }
      } else {
        answerResults[currentQuestionIndex] = false;
        wrongCount += 1;
        recordQuestionResult(question, false);
        updateProgressTracker();
        saveSession();
        stopQuestionTimer();
        correctIndices.forEach((idx) => {
          if (buttons[idx]) buttons[idx].classList.add('correct');
        });
        buttons.forEach((btn) => { btn.disabled = true; });
        updateMultipleChoiceStatus(question, optionsContainer, 'wrong');
        showQuestionExplanation(question, optionsContainer);
        if (!noTimersMode) startWaitCountdown();
      }
    }

    function handlePauseClick() {
      if (isPaused) return;
      if (questionTimerId !== null) {
        clearInterval(questionTimerId);
        questionTimerId = null;
        isPaused = true;
        pausePhase = 'question';
        pauseRemaining = questionRemainingSec;
        pauseQuestion = activeQuestions[currentQuestionIndex];
        pauseOptionsContainer = document.getElementById('options-container');
        setPauseResumeVisibility(true);
        const timerEl = document.querySelector('.timer');
        if (timerEl) timerEl.textContent = formatTime(pauseRemaining) + ' (paused)';
      } else if (waitTimerId !== null) {
        clearInterval(waitTimerId);
        waitTimerId = null;
        isPaused = true;
        pausePhase = 'wait';
        pauseRemaining = waitRemainingSec;
        setPauseResumeVisibility(true);
        const timerEl = document.querySelector('.timer');
        if (timerEl) timerEl.textContent = formatTime(pauseRemaining) + ' until next (paused)';
      }
    }

    function handleResumeClick() {
      if (!isPaused) return;
      if (pausePhase === 'question' && pauseQuestion && pauseOptionsContainer) {
        startQuestionTimer(pauseQuestion, pauseOptionsContainer, pauseRemaining);
      } else if (pausePhase === 'wait') {
        startWaitCountdown(pauseRemaining);
      }
      clearPauseState();
    }

    function handleSkipClick() {
      if (waitTimerId !== null) {
        stopWaitTimer();
        clearPauseState();
        goToNextQuestion();
      } else if (activeQuestions[currentQuestionIndex]) {
        const question = activeQuestions[currentQuestionIndex];
        const optionsContainer = document.getElementById('options-container');
        if (answerResults[currentQuestionIndex] === undefined) {
          handleTimeUp(question, optionsContainer);
        } else if (noTimersMode) {
          goToNextQuestion();
        }
      }
    }

    function handleShowAnswerClick() {
      if (currentQuestionIndex < 0 || currentQuestionIndex >= activeQuestions.length) return;
      const optionsContainer = document.getElementById('options-container');
      const question = activeQuestions[currentQuestionIndex];
      if (isTextQuestion(question)) {
        if (answerResults[currentQuestionIndex] !== undefined) return;
        handleTimeUp(question, optionsContainer);
        return;
      }
      const buttons = optionsContainer.querySelectorAll('.option-btn');
      if (!buttons.length || buttons[0].disabled) return;
      handleTimeUp(question, optionsContainer);
    }

    function toggleSettingsPanel() {
      document.getElementById('settings-panel').classList.toggle('open');
    }

    function updateSettingsFromUI() {
      var qInput = document.getElementById('setting-question-time');
      var wInput = document.getElementById('setting-wait-between');
      var noTimersInput = document.getElementById('setting-no-timers');
      if (qInput) {
        questionTimeSec = parseInt(qInput.value, 10);
        var qVal = document.getElementById('question-time-value');
        if (qVal) qVal.textContent = questionTimeSec;
      }
      if (wInput) {
        waitBetweenSec = parseInt(wInput.value, 10);
        var wVal = document.getElementById('wait-between-value');
        if (wVal) wVal.textContent = waitBetweenSec;
      }
      if (noTimersInput) {
        noTimersMode = noTimersInput.checked;
        if (activeQuestions.length > 0 && currentQuestionIndex < activeQuestions.length) {
          var nextBtn = document.getElementById('btn-next-question');
          var timerEl = document.querySelector('.timer');
          if (noTimersMode) {
            stopQuestionTimer();
            stopWaitTimer();
            if (nextBtn) nextBtn.classList.remove('hidden');
            if (timerEl) timerEl.textContent = 'No limit';
          } else {
            if (nextBtn) nextBtn.classList.add('hidden');
            if (timerEl) timerEl.textContent = formatTime(questionTimeSec);
            startQuestionTimer(activeQuestions[currentQuestionIndex], document.getElementById('options-container'));
          }
        }
      }
      savePreferences();
      saveSession();
    }

    function handleNextQuestionClick() {
      if (activeQuestions.length === 0 || currentQuestionIndex >= activeQuestions.length) return;
      var optionsContainer = document.getElementById('options-container');
      var question = activeQuestions[currentQuestionIndex];
      if (answerResults[currentQuestionIndex] === undefined) {
        answerResults[currentQuestionIndex] = false;
        wrongCount += 1;
        recordQuestionResult(question, false);
        updateProgressTracker();
        saveSession();
        if (isTextQuestion(question)) {
          revealTextAnswer(question, optionsContainer, false);
        } else {
          var buttons = optionsContainer.querySelectorAll('.option-btn');
          buttons.forEach(function (btn) { btn.disabled = true; });
          question.answer.forEach(function (idx) {
            if (buttons[idx]) buttons[idx].classList.add('correct');
          });
        }
        var showBtn = document.getElementById('btn-show-answer');
        if (showBtn) showBtn.disabled = true;
      }
      goToNextQuestion();
    }

    loadPreferences();
    applyPreferencesToUI();

    document.querySelector('.btn-pause').addEventListener('click', handlePauseClick);
    document.querySelector('.btn-resume').addEventListener('click', handleResumeClick);
    document.querySelector('.btn-skip').addEventListener('click', handleSkipClick);
    document.getElementById('btn-back').addEventListener('click', handleBackClick);
    document.getElementById('btn-show-answer').addEventListener('click', handleShowAnswerClick);
    document.getElementById('btn-next-question').addEventListener('click', handleNextQuestionClick);
    document.getElementById('btn-settings').addEventListener('click', toggleSettingsPanel);

    document.getElementById('setting-question-time').addEventListener('input', updateSettingsFromUI);
    document.getElementById('setting-question-time').addEventListener('change', updateSettingsFromUI);
    document.getElementById('setting-wait-between').addEventListener('input', updateSettingsFromUI);
    document.getElementById('setting-wait-between').addEventListener('change', updateSettingsFromUI);
    document.getElementById('setting-no-timers').addEventListener('change', updateSettingsFromUI);

    window.addEventListener('beforeunload', function () {
      savePreferences();
      saveSession();
    });

    function loadQuestionsWhenReady() {
      loadQuestions();
    }
    loadQuestionsWhenReady();
  </script>
</body>
</html>
